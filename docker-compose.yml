services: 
  backend: 
    build: ./backend 
    ports: 
      - "8000:8000" 
    env_file: 
      - path: .env 
        required: false 
    restart: unless-stopped 
    volumes:
      - ./backend:/app # Kodu kaydettikce guncellemesi icin
  frontend: 
    build: ./frontend 
    ports: 
      - "3000:80" 
    depends_on: 
      - backend 
    restart: unless-stopped